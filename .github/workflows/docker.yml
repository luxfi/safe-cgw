name: Docker

# Builds ghcr.io/luxfi/safe-cgw on the lux-build ARC pool in lux-k8s.
#
# This lives in .github/workflows, not .hanzo/workflows: the forge at
# git.hanzo.ai does not host luxfi/safe-cgw, so a workflow filed there has no
# scheduler and every tag since v0.1.2 built nowhere. luxfi/safe-wallet proves
# the GitHub + lux-build path works (lux-v2.2.6, 11m16s).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'existing version tag to (re)build, e.g. v0.1.3'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: lux-build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Login to GHCR
        # The ghcr.io/luxfi/safe-cgw package is linked to no repository, so the
        # repo-scoped GITHUB_TOKEN cannot write it — org-admin GHCR_PAT does.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: zeekay
          password: ${{ secrets.GHCR_PAT }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/luxfi/safe-cgw
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=sha,format=short,prefix=sha-

      - name: Build & push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=ghcr.io/luxfi/safe-cgw:buildcache
          cache-to: type=registry,ref=ghcr.io/luxfi/safe-cgw:buildcache,mode=max
